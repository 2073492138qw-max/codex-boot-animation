name: Windows build and tests

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: pwsh
        run: ./scripts/Build.ps1
      - name: Inspect media prerequisites
        shell: pwsh
        run: |
          Get-WindowsFeature Server-Media-Foundation | Select-Object Name, InstallState
          Get-Service Audiosrv, AudioEndpointBuilder | Select-Object Name, Status, StartType
          Get-CimInstance Win32_SoundDevice | Select-Object Name, Status
      - name: Compare software-rendered decoder probe
        shell: pwsh
        env:
          CBA_PROBE_SOFTWARE_RENDERING: '1'
        run: |
          $exe = Join-Path $PWD 'plugins/codex-boot-animation/hooks/BootPlayer.exe'
          $probe = Start-Process -FilePath $exe -ArgumentList '--intro-media-decoder-probe' -WindowStyle Hidden -PassThru
          try {
            if (-not $probe.WaitForExit(18000)) { $probe.Kill(); throw 'Software decoder probe timed out.' }
            if ($probe.ExitCode -ne 0) { throw 'Software decoder probe failed.' }
          } finally { $probe.Dispose() }
      - name: Test
        shell: pwsh
        run: ./scripts/Test.ps1
      - name: Test Windows PowerShell 5.1
        shell: powershell
        run: ./scripts/Test.ps1
      - name: Report failed test diagnostics
        if: failure()
        shell: pwsh
        run: |
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version
          Write-Output "Interactive=$([Environment]::UserInteractive) Session=$((Get-Process -Id $PID).SessionId)"
          $log = Join-Path $env:USERPROFILE '.codex-boot-animation/playback.log'
          if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log -Tail 80 }
          else { Write-Output 'No test playback log was created.' }
      - name: Restore checked-in binary after build verification
        shell: pwsh
        run: git restore plugins/codex-boot-animation/hooks/BootPlayer.exe
      - name: Package reviewed Git snapshot
        shell: pwsh
        run: ./scripts/Package-Release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-alpha-release
          path: dist/*
