name: Bug report
description: Report a reproducible intro or startup issue
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include expected behavior and exact steps to reproduce.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Windows and Codex versions
      placeholder: Windows 11; Codex desktop version
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: Remove usernames, file paths, chat IDs, tokens and private data before posting. Do not upload an entire Codex log.
      render: text
